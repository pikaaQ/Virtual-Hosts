name: Build and Release APK

on:
  push:
    tags:
      - 'v*'  # 触发条件：推送以 v 开头的标签，如 v1.0.0
  workflow_dispatch:  # 允许手动触发

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 11
      uses: actions/setup-java@v3
      with:
        java-version: '11'
        distribution: 'temurin'
        
    - name: Cache Gradle packages
      uses: actions/cache@v3
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-
          
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    - name: Set up Android SDK
      run: |
        # 安装必要的Android SDK组件
        echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-33" "build-tools;30.0.3"
        echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses
        echo "SDK components installed."
        
    - name: Setup keystore for release build
      run: |
        mkdir -p app/keystore
        
        # 检查必要的secrets是否存在
        if [[ -z "${{ secrets.KEYSTORE_BASE64 }}" ]]; then
          echo "Error: KEYSTORE_BASE64 secret is not set"
          exit 1
        fi
        
        if [[ -z "${{ secrets.RELEASE_STORE_PASSWORD }}" ]]; then
          echo "Error: RELEASE_STORE_PASSWORD secret is not set"
          exit 1
        fi
        
        if [[ -z "${{ secrets.RELEASE_KEY_ALIAS }}" ]]; then
          echo "Error: RELEASE_KEY_ALIAS secret is not set"
          exit 1
        fi
        
        if [[ -z "${{ secrets.RELEASE_KEY_PASSWORD }}" ]]; then
          echo "Error: RELEASE_KEY_PASSWORD secret is not set"
          exit 1
        fi
        
        # 从GitHub Secrets获取keystore文件并解码
        echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/keystore/release.keystore
        echo "Keystore file restored"
        
        # 验证keystore文件
        if [[ ! -f "app/keystore/release.keystore" ]]; then
          echo "Error: Keystore file was not created"
          exit 1
        fi
        
        # 显示keystore信息（不包含敏感数据）
        keytool -list -v -keystore app/keystore/release.keystore -storepass "${{ secrets.RELEASE_STORE_PASSWORD }}" | head -20
        
    - name: Build Release APK (GitHub flavor)
      run: |
        echo "Building release APK with the following parameters:"
        echo "Store file: app/keystore/release.keystore"
        echo "Store password: [REDACTED]"
        echo "Key alias: ${{ secrets.RELEASE_KEY_ALIAS }}"
        echo "Key password: [REDACTED]"
        
        # 确保keystore文件存在
        if [ ! -f "app/keystore/release.keystore" ]; then
          echo "Error: Keystore file not found!"
          exit 1
        fi
        
        # 构建release APK - 如果失败直接退出
        ./gradlew assembleGithubRelease \
          -Pandroid.injected.signing.store.file=app/keystore/release.keystore \
          -Pandroid.injected.signing.store.password=${{ secrets.RELEASE_STORE_PASSWORD }} \
          -Pandroid.injected.signing.key.alias=${{ secrets.RELEASE_KEY_ALIAS }} \
          -Pandroid.injected.signing.key.password=${{ secrets.RELEASE_KEY_PASSWORD }} \
          --info
          
        # 检查构建是否成功
        if [ $? -ne 0 ]; then
          echo "Release build failed! Exiting workflow."
          exit 1
        fi
          
    - name: Check build outputs
      run: |
        echo "=== Release APKs ==="
        find app/build/outputs/apk/ -name "*.apk" -type f -ls || echo "No release APKs found"
        
        echo "=== All build outputs ==="
        find app/build/outputs/apk -name "*" -type f -ls || echo "No APK files found"
      
    - name: Get version info
      id: version
      run: |
        if [[ $GITHUB_REF == refs/tags/* ]]; then
          VERSION=${GITHUB_REF#refs/tags/}
        else
          VERSION="latest"
        fi
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "VERSION_NAME=$(grep 'versionName' app/build.gradle | awk -F '"' '{print $2}')" >> $GITHUB_OUTPUT
        
    - name: Create Release
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.version.outputs.version }}
        release_name: Virtual Hosts ${{ steps.version.outputs.version }}
        body: |
          ## 更新内容
          - 此版本基于标签 ${{ steps.version.outputs.version }} 自动构建
          - 版本号: ${{ steps.version.outputs.VERSION_NAME }}
          
          ## 下载说明
          - `vhosts-github-release.apk`: GitHub发布版本，经过混淆和优化，可直接安装使用
          
          ## 安装方法
          1. 下载对应的 APK 文件
          2. 在 Android 设备上允许安装未知来源应用
          3. 安装 APK 文件
          
          ## 注意事项
          - 应用需要 VPN 权限才能正常工作
          - 支持通配符 DNS 记录是此应用的核心特性
        draft: false
        prerelease: false
        
    - name: Check if GitHub Release APK exists
      id: check_github_release
      run: |
        echo "Checking for GitHub release APK..."
        # Gradle使用productFlavors时，APK文件名格式为 app-{flavor}-{buildtype}.apk
        # 当使用签名配置时，Gradle会生成已签名的APK
        GITHUB_RELEASE_APK_PATH="app/build/outputs/apk/github/release/app-github-release.apk"
        
        if [ -f "$GITHUB_RELEASE_APK_PATH" ]; then
          echo "✅ GitHub Release APK found at: $GITHUB_RELEASE_APK_PATH"
          echo "github_release_exists=true" >> $GITHUB_OUTPUT
          echo "github_release_path=$GITHUB_RELEASE_APK_PATH" >> $GITHUB_OUTPUT
          
          # 显示APK信息
          ls -lh "$GITHUB_RELEASE_APK_PATH"
          echo "APK size: $(stat -c%s "$GITHUB_RELEASE_APK_PATH") bytes"
        else
          echo "❌ Expected APK not found at: $GITHUB_RELEASE_APK_PATH"
          
          # 查找所有在github/release目录下的APK文件
          APK_FILES=$(find app/build/outputs/apk/github/release -name "*.apk" -type f)
          if [ -n "$APK_FILES" ]; then
            echo "Found APK files in github/release directory:"
            echo "$APK_FILES" | while read file; do
              echo "  - $file ($(stat -c%s "$file") bytes)"
            done
            
            # 选择最新生成的APK文件
            FOUND_APK_PATH=$(find app/build/outputs/apk/github/release -name "*.apk" -type f | head -n 1)
            if [ -n "$FOUND_APK_PATH" ]; then
              echo "Using first found APK: $FOUND_APK_PATH"
              echo "github_release_exists=true" >> $GITHUB_OUTPUT
              echo "github_release_path=$FOUND_APK_PATH" >> $GITHUB_OUTPUT
            else
              echo "github_release_exists=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "❌ No APK files found in github/release directory"
            echo "github_release_exists=false" >> $GITHUB_OUTPUT
          fi
        fi
        
    - name: Upload GitHub Release APK
      if: steps.check_github_release.outputs.github_release_exists == 'true'
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ${{ steps.check_github_release.outputs.github_release_path }}
        asset_name: vhosts-github-release.apk
        asset_content_type: application/vnd.android.package-archive
        
    