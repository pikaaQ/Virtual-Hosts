name: Build and Release APK

on:
  push:
    tags:
      - 'v*'  # 触发条件：推送以 v 开头的标签，如 v1.0.0
  workflow_dispatch:  # 允许手动触发

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 11
      uses: actions/setup-java@v3
      with:
        java-version: '11'
        distribution: 'temurin'
        
    - name: Cache Gradle packages
      uses: actions/cache@v3
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-
          
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    - name: Build Debug APK (GitHub flavor)
      run: ./gradlew assembleGithubDebug
      
    - name: Setup keystore for release build
      run: |
        mkdir -p app/keystore
        
        # 检查必要的secrets是否存在
        if [[ -z "${{ secrets.KEYSTORE_BASE64 }}" ]]; then
          echo "Error: KEYSTORE_BASE64 secret is not set"
          exit 1
        fi
        
        if [[ -z "${{ secrets.RELEASE_STORE_PASSWORD }}" ]]; then
          echo "Error: RELEASE_STORE_PASSWORD secret is not set"
          exit 1
        fi
        
        if [[ -z "${{ secrets.RELEASE_KEY_ALIAS }}" ]]; then
          echo "Error: RELEASE_KEY_ALIAS secret is not set"
          exit 1
        fi
        
        if [[ -z "${{ secrets.RELEASE_KEY_PASSWORD }}" ]]; then
          echo "Error: RELEASE_KEY_PASSWORD secret is not set"
          exit 1
        fi
        
        # 从GitHub Secrets获取keystore文件并解码
        echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/keystore/release.keystore
        echo "Keystore file restored"
        
        # 验证keystore文件
        if [[ ! -f "app/keystore/release.keystore" ]]; then
          echo "Error: Keystore file was not created"
          exit 1
        fi
        
        # 显示keystore信息（不包含敏感数据）
        keytool -list -v -keystore app/keystore/release.keystore -storepass "${{ secrets.RELEASE_STORE_PASSWORD }}" | head -20
        
    - name: Build Release APK (GitHub flavor)
      run: |
        echo "Building release APK with the following parameters:"
        echo "Store file: app/keystore/release.keystore"
        echo "Store password: [REDACTED]"
        echo "Key alias: ${{ secrets.RELEASE_KEY_ALIAS }}"
        echo "Key password: [REDACTED]"
        
        ./gradlew assembleGithubRelease \
          -PRELEASE_STORE_FILE=app/keystore/release.keystore \
          -PRELEASE_STORE_PASSWORD=${{ secrets.RELEASE_STORE_PASSWORD }} \
          -PRELEASE_KEY_ALIAS=${{ secrets.RELEASE_KEY_ALIAS }} \
          -PRELEASE_KEY_PASSWORD=${{ secrets.RELEASE_KEY_PASSWORD }} \
          || echo "Release build failed"
          
    - name: Check build outputs
      run: |
        echo "=== Debug APK ==="
        find app/build/outputs/apk/github/debug -name "*.apk" -type f -ls || echo "No debug APK found"
        
        echo "=== Release APK ==="
        find app/build/outputs/apk/github/release -name "*.apk" -type f -ls || echo "No release APK found"
        
        echo "=== All APKs ==="
        find app/build/outputs/apk -name "*.apk" -type f -ls || echo "No APKs found"
      
    - name: Get version info
      id: version
      run: |
        if [[ $GITHUB_REF == refs/tags/* ]]; then
          VERSION=${GITHUB_REF#refs/tags/}
        else
          VERSION="latest"
        fi
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "VERSION_NAME=$(grep 'versionName' app/build.gradle | awk -F '"' '{print $2}')" >> $GITHUB_OUTPUT
        
    - name: Create Release
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.version.outputs.version }}
        release_name: Virtual Hosts ${{ steps.version.outputs.version }}
        body: |
          ## 更新内容
          - 此版本基于标签 ${{ steps.version.outputs.version }} 自动构建
          - 版本号: ${{ steps.version.outputs.VERSION_NAME }}
          
          ## 下载说明
          - `vhosts-github-debug.apk`: 调试版本，包含调试信息，体积较大
          - `vhosts-github-release.apk`: 发布版本，经过混淆和优化，体积较小（如果可用）
          
          ## 安装方法
          1. 下载对应的 APK 文件
          2. 在 Android 设备上允许安装未知来源应用
          3. 安装 APK 文件
          
          ## 注意事项
          - 应用需要 VPN 权限才能正常工作
          - 支持通配符 DNS 记录是此应用的核心特性
          - 如果发布版本不可用，请使用调试版本
        draft: false
        prerelease: false
        
    - name: Upload Debug APK
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: app/build/outputs/apk/github/debug/app-github-debug.apk
        asset_name: vhosts-github-debug.apk
        asset_content_type: application/vnd.android.package-archive
        
    - name: Check if Release APK exists
      id: check_release
      run: |
        echo "Checking for release APK..."
        RELEASE_APK_PATH="app/build/outputs/apk/github/release/app-github-release.apk"
        
        if [ -f "$RELEASE_APK_PATH" ]; then
          echo "✅ Release APK found at: $RELEASE_APK_PATH"
          echo "release_exists=true" >> $GITHUB_OUTPUT
          echo "release_path=$RELEASE_APK_PATH" >> $GITHUB_OUTPUT
          
          # 显示APK信息
          ls -lh "$RELEASE_APK_PATH"
        else
          echo "❌ Release APK not found at: $RELEASE_APK_PATH"
          echo "release_exists=false" >> $GITHUB_OUTPUT
          
          # 查找可能的APK文件
          echo "Searching for alternative APK files..."
          find app/build/outputs/apk -name "*release*.apk" -type f -ls || echo "No release APKs found anywhere"
        fi
        
    - name: Upload Release APK
      if: steps.check_release.outputs.release_exists == 'true'
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ${{ steps.check_release.outputs.release_path }}
        asset_name: vhosts-github-release.apk
        asset_content_type: application/vnd.android.package-archive
        
    - name: Build failure notice
      if: steps.check_release.outputs.release_exists == 'false'
      run: |
        echo "⚠️ Release APK build failed"
        echo "Please check the build logs above for errors"
        echo "Common issues:"
        echo "1. Missing or incorrect keystore secrets"
        echo "2. Invalid keystore password or alias"
        echo "3. Gradle build configuration issues"
        echo "4. Corrupted keystore file"