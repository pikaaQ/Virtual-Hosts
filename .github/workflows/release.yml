name: Build and Release APK

on:
  push:
    tags:
      - 'v*'  # 触发条件：推送以 v 开头的标签，如 v1.0.0
  workflow_dispatch:  # 允许手动触发

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 11
      uses: actions/setup-java@v3
      with:
        java-version: '11'
        distribution: 'temurin'
        
    - name: Cache Gradle packages
      uses: actions/cache@v3
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-
          
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    - name: Build Debug APK (GitHub flavor)
      run: ./gradlew assembleGithubDebug
      
    - name: Build Release APK (GitHub flavor)
      run: ./gradlew assembleGithubRelease
      
    - name: Get version info
      id: version
      run: |
        if [[ $GITHUB_REF == refs/tags/* ]]; then
          VERSION=${GITHUB_REF#refs/tags/}
        else
          VERSION="latest"
        fi
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "VERSION_NAME=$(grep 'versionName' app/build.gradle | awk -F '"' '{print $2}')" >> $GITHUB_OUTPUT
        
    - name: Create Release
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.version.outputs.version }}
        release_name: Virtual Hosts ${{ steps.version.outputs.version }}
        body: |
          ## 更新内容
          - 此版本基于标签 ${{ steps.version.outputs.version }} 自动构建
          - 版本号: ${{ steps.version.outputs.VERSION_NAME }}
          
          ## 下载说明
          - `vhosts-github-debug.apk`: 调试版本，包含调试信息，体积较大
          - `vhosts-github-release.apk`: 发布版本，经过混淆和优化，体积较小
          
          ## 安装方法
          1. 下载对应的 APK 文件
          2. 在 Android 设备上允许安装未知来源应用
          3. 安装 APK 文件
          
          ## 注意事项
          - 应用需要 VPN 权限才能正常工作
          - 支持通配符 DNS 记录是此应用的核心特性
        draft: false
        prerelease: false
        
    - name: Upload Debug APK
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: app/build/outputs/apk/github/debug/app-github-debug.apk
        asset_name: vhosts-github-debug.apk
        asset_content_type: application/vnd.android.package-archive
        
    - name: Upload Release APK
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: app/build/outputs/apk/github/release/app-github-release.apk
        asset_name: vhosts-github-release.apk
        asset_content_type: application/vnd.android.package-archive